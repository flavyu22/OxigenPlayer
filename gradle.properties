# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# File watching is unreliable on some Windows/removable volumes and only affects
# incremental build speed, not correctness.
org.gradle.vfs.watch=false
# A bounded heap is friendlier to developer laptops and CI workers.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.workers.max=4

# Kotlin and Compose
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Release optimization
android.enableR8.fullMode=true

# Android build flags
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Provider credentials are deliberately disabled by default. For local provider
# integration testing, opt in from ~/.gradle/gradle.properties and keep the
# credential file outside this project (see secrets.properties.example).
OXIGEN_EMBED_PROVIDER_CREDENTIALS=false
OXIGEN_SECRETS_FILE=oxigenplayer-secrets.properties
